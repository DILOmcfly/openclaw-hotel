      # - FLY_API_TOKEN: Fly.io API token from fly.io/user/personal_access_tokens
      #
      # Required secrets in Fly.io (set via `flyctl secrets set`):
      # - DATABASE_URL: PostgreSQL connection string
      # - REDIS_URL: Redis connection string  
      # - JWT_SECRET: Secret for JWT signing
      #
      # fly.toml should be configured with:
