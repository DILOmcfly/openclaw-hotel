name: Deploy to Production

# Manual deployment trigger
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        APP_DIR: ${{ secrets.APP_DIR || '/opt/openclaw-hotel' }}
      run: |
        ssh $SERVER_USER@$SERVER_HOST << 'ENDSSH'
          cd ${{ env.APP_DIR }}
          git pull origin main
          docker compose build
          docker compose up -d
          docker compose exec -T backend npx prisma migrate deploy
          cd client
          npm ci
          npm run build
          sudo cp -r dist/* /var/www/openclaw-hotel/client/
          sudo systemctl reload nginx
        ENDSSH

    - name: Health check
      run: |
        sleep 10
        curl -f https://${{ secrets.SERVER_HOST }}/health || exit 1

    - name: Notify deployment
      if: success()
      run: |
        echo "Deployment to ${{ github.event.inputs.environment }} successful!"
        # Add Slack/Discord/Telegram notification here if needed

# Required secrets (set in GitHub repository settings):
# - SSH_PRIVATE_KEY: Private key for SSH access to server
# - SERVER_HOST: Server hostname or IP
# - SERVER_USER: SSH user (e.g., root, ubuntu)
# - APP_DIR: Application directory (optional, defaults to /opt/openclaw-hotel)
