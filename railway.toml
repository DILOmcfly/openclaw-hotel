# Railway.toml — OpenClaw Hotel Production Configuration
# https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "./entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway auto-provides these environment variables:
# - PORT (automatically assigned)
# - DATABASE_URL (from PostgreSQL plugin)
# - REDIS_URL (from Redis plugin)
# - RAILWAY_ENVIRONMENT (production/staging)
# - RAILWAY_SERVICE_NAME, RAILWAY_PROJECT_NAME, etc.

# NOTE: You must manually set JWT_SECRET in Railway dashboard:
# Railway Dashboard → Environment → Variables → Add Variable:
#   JWT_SECRET = <output of: openssl rand -base64 32>
